name: Temporary Security Watch verification

on:
  push:
    branches:
      - feat/security-watch-core

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install and verify Security Watch
        run: |
          cd observatory
          npm ci
          npm test
          node --check watch/store.mjs
          npx wrangler deploy --dry-run
      - name: Verify patch and remove temporary workflow
        run: |
          git diff --check
          rm .github/workflows/tmp-security-watch-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove temporary Security Watch verifier'
          git push origin HEAD:feat/security-watch-core
