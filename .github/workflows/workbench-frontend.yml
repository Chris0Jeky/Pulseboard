name: Workbench frontend

on:
  pull_request:
    paths:
      - 'frontend/pulseboard-web/**'
      - '.github/workflows/workbench-frontend.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/pulseboard-web/**'
      - '.github/workflows/workbench-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-frontend-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/pulseboard-web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/pulseboard-web/package-lock.json
      - run: npm ci
      - name: Run frontend tests
        run: npx vitest run --maxWorkers=2
      - name: Build production frontend
        run: npm run build
      - name: Build production container
        run: docker build --tag pulseboard-frontend:ci .
      - name: Audit complete dependency graph
        run: npm audit --audit-level=low
      - name: Verify patch whitespace
        working-directory: .
        env:
          PULL_REQUEST_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$PULL_REQUEST_BASE" ]; then
            git diff --check "$PULL_REQUEST_BASE"...HEAD
          else
            git diff --check HEAD^
          fi
