name: Python package

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - README.md
      - legacy/backend/**
      - LICENSE
      - LICENSES/**
      - RELICENSING.md
      - THIRD_PARTY_NOTICES.md
      - scripts/verify_python_package.py
      - .github/workflows/python-package.yml
  pull_request:
    branches: [main]
    paths:
      - pyproject.toml
      - README.md
      - legacy/backend/**
      - LICENSE
      - LICENSES/**
      - RELICENSING.md
      - THIRD_PARTY_NOTICES.md
      - scripts/verify_python_package.py
      - .github/workflows/python-package.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build at minimum Setuptools
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the minimum backend and build frontend
        run: |
          python -m pip install --disable-pip-version-check "setuptools==77.0.3" wheel build
          python -c "import setuptools; assert setuptools.__version__ == '77.0.3', setuptools.__version__"

      - name: Build source and wheel distributions
        run: python -m build --no-isolation

      - name: Verify PEP 639 metadata and licence payloads
        run: python scripts/verify_python_package.py
