name: Deploy observatory
# Deploys the collector and Desk Worker after every main push that touches observatory/, once its tests pass.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (HUMAN_TODO q-27); without them it
# skips with a notice. It deploys only the current head of main, and only when production D1 already carries the
# schema version the code expects: apply a migration by hand first (observatory/docs/HOSTING.md), then re-run.
on:
  push:
    branches: [main]
    paths: ['observatory/**', '.github/workflows/deploy-observatory.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-observatory
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy automatically (HUMAN_TODO q-27).'
          fi
      - name: Deploy only the head of main
        id: head
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # A re-run of an older run, or a manual run from another branch, must never replace what main holds.
          head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [ "$GITHUB_REF" = "refs/heads/main" ] && [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::This run is for ${GITHUB_REF} at ${GITHUB_SHA:0:7}, not the head of main (${head:0:7})."
          fi
      - uses: actions/setup-node@v6
        if: steps.head.outputs.current == 'true'
        with:
          node-version: '22'
      - name: Install
        if: steps.head.outputs.current == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: observatory
      - name: Test
        if: steps.head.outputs.current == 'true'
        run: npm test
        working-directory: observatory
      - name: Check the production schema
        if: steps.head.outputs.current == 'true'
        working-directory: observatory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          # Compare against production itself, so a migration an earlier run stopped on can never slip through later.
          expected="$(node --input-type=module -e "import { SCHEMA_VERSION } from './src/worker.mjs'; console.log(SCHEMA_VERSION)")"
          npx wrangler d1 execute pulseboard-observatory --remote --env="" --json --command "SELECT version FROM schema_version WHERE id=1" > schema.json
          live="$(node -e "const r = JSON.parse(require('fs').readFileSync('schema.json', 'utf8')); console.log(r[0].results[0].version)")"
          if [ "$live" != "$expected" ]; then
            echo "::error title=Schema mismatch::Production D1 is at schema $live but this code expects $expected. Apply the migration by hand (observatory/docs/HOSTING.md), then re-run this workflow."
            exit 1
          fi
          echo "Production schema $live matches the code."
      - name: Deploy
        if: steps.head.outputs.current == 'true'
        working-directory: observatory
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # shell: bash turns on pipefail, so a failed deploy fails the step despite the tee.
        shell: bash
        run: npx wrangler deploy --env="" | tee deploy.log
      - name: Check the live collector
        if: steps.head.outputs.current == 'true'
        run: |
          version="$(grep -o 'Current Version ID: [0-9a-f-]*' observatory/deploy.log | cut -d' ' -f4)"
          sleep 15
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -q -fsS --max-time 15 https://pulseboard-observatory.commit-atlas.workers.dev/readyz || true)"
            if printf '%s' "$body" | grep -q '"ready":true'; then
              echo "### Deployed \`${version:0:8}\` from \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "/readyz: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Collector not ready::/readyz did not report ready after deploying ${version}. Roll back with npx wrangler rollback (observatory/docs/HOSTING.md)."
          exit 1
