name: Deploy observatory
# Deploys the collector and Desk Worker after every main push that touches observatory/, once its tests pass.
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (HUMAN_TODO q-27); without them it
# skips with a notice. A push that changes a D1 schema stops before deploying: apply the migration by hand
# (observatory/docs/HOSTING.md), then run this workflow manually with schema_applied ticked.
on:
  push:
    branches: [main]
    paths: ['observatory/**', '.github/workflows/deploy-observatory.yml']
  workflow_dispatch:
    inputs:
      schema_applied:
        description: 'Every D1 migration in this range is already applied to production'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: deploy-observatory
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=Deploy skipped::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy automatically (HUMAN_TODO q-27).'
          fi
      - name: Stop on schema changes
        if: steps.secrets.outputs.ready == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.schema_applied)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A push range normally starts at the previous main head; a manual run or a new branch has none, so compare
          # with the parent commit instead.
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BEFORE="$(git rev-parse HEAD~1)"
          fi
          changed="$(git diff --name-only "$BEFORE" HEAD -- observatory/migrations observatory/schema.sql observatory/watch/schema.sql)"
          if [ -n "$changed" ]; then
            echo "::error title=Schema change::This range changes a D1 schema: $changed. Apply the migration to production first (observatory/docs/HOSTING.md), then run this workflow manually with schema_applied ticked."
            exit 1
          fi
      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: npm ci --no-audit --no-fund
        working-directory: observatory
      - name: Test
        if: steps.secrets.outputs.ready == 'true'
        run: npm test
        working-directory: observatory
      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # shell: bash turns on pipefail, so a failed deploy fails the step despite the tee.
        shell: bash
        run: npx wrangler deploy | tee deploy.log
        working-directory: observatory
      - name: Check the live collector
        if: steps.secrets.outputs.ready == 'true'
        run: |
          version="$(grep -o 'Current Version ID: [0-9a-f-]*' observatory/deploy.log | cut -d' ' -f4)"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -q -fsS https://pulseboard-observatory.commit-atlas.workers.dev/readyz || true)"
            if printf '%s' "$body" | grep -q '"ready":true'; then
              echo "### Deployed \`${version:0:8}\` from \`${GITHUB_SHA:0:7}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "/readyz: \`$body\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo "::error title=Collector not ready::/readyz did not report ready after deploying ${version}. Roll back with npx wrangler rollback (observatory/docs/HOSTING.md)."
          exit 1
