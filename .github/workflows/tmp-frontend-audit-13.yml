name: Temporary frontend dependency audit

on:
  push:
    branches:
      - chore/frontend-audit-triage-13

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/pulseboard-web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/pulseboard-web/package-lock.json
      - name: Raise the direct Vitest tools to the audited safe line
        shell: bash
        run: |
          node <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = { vitest: '^4.0.10', '@vitest/ui': '^4.0.10' };
          for (const [name, version] of Object.entries(expected)) {
            if (pkg.devDependencies?.[name] !== version) {
              throw new Error(`Expected ${name} ${version}, found ${pkg.devDependencies?.[name]}`);
            }
          }
          pkg.devDependencies.vitest = '^4.1.11';
          pkg.devDependencies['@vitest/ui'] = '^4.1.11';
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Apply remaining semver-compatible advisory fixes
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then exit "$code"; fi
      - name: Show the proposed dependency changes
        shell: bash
        run: |
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json
          test -n "$(git status --short -- package-lock.json package.json)"
      - name: Install and prove the application gates
        shell: bash
        run: |
          npm ci
          npx vitest run --maxWorkers=2
          npm run build
      - name: Require clean runtime and full dependency audits
        shell: bash
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low
