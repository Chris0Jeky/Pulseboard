name: Temporary frontend audit repair

on:
  push:
    branches:
      - fix/frontend-audit-13

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/pulseboard-web
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/pulseboard-web/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking audit fixes only
        shell: bash
        run: |
          set +e
          npm audit fix
          status=$?
          set -e
          if [ "$status" -gt 1 ]; then
            exit "$status"
          fi
      - name: Reinstall from the repaired lock
        run: npm ci
      - name: Run frontend tests
        run: npx vitest run --maxWorkers=2
      - name: Build production frontend
        run: npm run build
      - name: Require a clean runtime dependency graph
        run: npm audit --omit=dev --audit-level=low
      - name: Print residual development-tool advisories
        shell: bash
        run: npm audit --json || true
      - name: Verify and publish the repaired lock
        working-directory: .
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/tmp-frontend-audit-13.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: apply non-breaking frontend audit updates'
          git push origin HEAD:fix/frontend-audit-13
