name: Temporary frontend dependency audit

on:
  push:
    branches:
      - chore/frontend-audit-triage-13

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/pulseboard-web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/pulseboard-web/package-lock.json
      - run: npm ci
      - name: Apply only semver-compatible audit fixes to the lockfile
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Show the proposed dependency changes
        shell: bash
        run: |
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json
          test -n "$(git status --short -- package-lock.json package.json)"
      - name: Reinstall and prove the application gates
        shell: bash
        run: |
          npm ci
          npx vitest run --maxWorkers=2
          npm run build
      - name: Capture post-fix full and runtime audits
        shell: bash
        run: |
          npm audit --json > audit-all.json || true
          npm audit --omit=dev --json > audit-runtime.json || true
          node <<'NODE'
          import fs from 'node:fs';
          for (const name of ['audit-runtime.json', 'audit-all.json']) {
            const report = JSON.parse(fs.readFileSync(name, 'utf8'));
            const vulnerabilities = Object.fromEntries(Object.entries(report.vulnerabilities || {}).map(([pkg, value]) => [pkg, {
              severity: value.severity,
              isDirect: value.isDirect,
              via: (value.via || []).map(item => typeof item === 'string' ? item : {
                source: item.source,
                name: item.name,
                title: item.title,
                url: item.url,
                severity: item.severity,
                range: item.range,
              }),
              effects: value.effects,
              range: value.range,
              nodes: value.nodes,
              fixAvailable: value.fixAvailable,
            }]));
            console.log(`AUDIT_REPORT_BEGIN ${name}`);
            console.log(JSON.stringify({ metadata: report.metadata, vulnerabilities }, null, 2));
            console.log(`AUDIT_REPORT_END ${name}`);
          }
          NODE
