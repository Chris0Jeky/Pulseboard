name: Temporary frontend dependency audit

on:
  push:
    branches:
      - chore/frontend-audit-triage-13

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/pulseboard-web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/pulseboard-web/package-lock.json
      - run: npm ci
      - name: Apply only semver-compatible audit fixes to the lockfile
        shell: bash
        run: npm audit fix --package-lock-only --ignore-scripts || test $? -eq 1
      - name: Raise the direct Vitest tools to the audited safe line
        run: npm install --save-dev --ignore-scripts vitest@^4.1.11 @vitest/ui@^4.1.11
      - name: Show the proposed dependency changes
        shell: bash
        run: |
          git diff --stat -- package.json package-lock.json
          git diff -- package.json package-lock.json
          test -n "$(git status --short -- package-lock.json package.json)"
      - name: Reinstall and prove the application gates
        shell: bash
        run: |
          npm ci
          npx vitest run --maxWorkers=2
          npm run build
      - name: Require clean runtime and full dependency audits
        shell: bash
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=low
