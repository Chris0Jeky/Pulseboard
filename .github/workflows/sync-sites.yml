name: Sync sites
# Keeps every site's installed Pulseboard SDK copy in step with main (owner decision 2026-09-27, HUMAN_TODO q-29).
# For each site it rebuilds the installs listed in the site's observatory.lock.json, runs the site's own
# observatory/check.mjs, and opens or updates one pull request from the pulseboard/sdk-sync branch. That pull
# request merges itself only when its diff stays inside the synced files, the site check passes and every
# GitHub Actions run on its head succeeds; otherwise it stays open, marked for a person.
on:
  push:
    branches: [main]
    paths:
      - 'observatory/sdk/**'
      - 'observatory/src/projects.mjs'
      - 'observatory/src/alibi-releases.mjs'
      - 'observatory/adapters/build-sdk.mjs'
      - 'observatory/adapters/build-embed.mjs'
      - 'observatory/adapters/check-installed.mjs'
      - 'observatory/adapters/sync-hosts.mjs'
      - '.github/workflows/sync-sites.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-sites
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        repo:
          - Chris0Jeky/CV_and_Portfolio
          - Chris0Jeky/CommitAtlas
          - Chris0Jeky/IdleHarbor
          - Chris0Jeky/developer-lens
          - Chris0Jeky/wealthlens-hq
          - Chris0Jeky/MDviewer
          - Chris0Jeky/Alibi
    env:
      REPO: ${{ matrix.repo }}
      BRANCH: pulseboard/sdk-sync
    steps:
      - name: Check the token
        id: token
        env:
          SITES_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          if [ -n "$SITES_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=Site sync skipped::Add the SITES_TOKEN repository secret to sync the sites (HUMAN_TODO q-29).'
          fi
      - uses: actions/checkout@v6
        if: steps.token.outputs.ready == 'true'
        with:
          path: pulseboard
          persist-credentials: false
      - uses: actions/checkout@v6
        if: steps.token.outputs.ready == 'true'
        with:
          repository: ${{ matrix.repo }}
          path: site
          fetch-depth: 50
          # The site's own check code runs next; the token must not be reachable from it.
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Sync the installed SDK
        id: sync
        if: steps.token.outputs.ready == 'true'
        shell: bash
        run: |
          # env -i: the site's check.mjs runs with no token, no GITHUB_ENV/GITHUB_OUTPUT and no runner secrets.
          env -i PATH="$PATH" HOME="$HOME" node pulseboard/observatory/adapters/sync-hosts.mjs site > report.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('report.json', 'utf8'));
            const out = [
              'changed=' + (r.changed.length > 0),
              'sdk=' + r.sdk,
              'check_ok=' + r.hostCheck.ok,
            ];
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, out.join('\n') + '\n');
            require('fs').writeFileSync('check-detail.txt', r.hostCheck.detail || '');
            require('fs').writeFileSync('allowed.txt', r.allowed.join('\n') + '\n');"
          echo "### ${REPO}" >> "$GITHUB_STEP_SUMMARY"
          echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"; cat report.json >> "$GITHUB_STEP_SUMMARY"; echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Close a sync pull request that is no longer needed
        if: steps.sync.outputs.changed == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          # Close only a pull request whose commits are all the bot's; a person's work stays open.
          others="$(gh pr view "$number" --repo "$REPO" --json commits -q '[.commits[].authors[].email] | map(select(. != "41898282+github-actions[bot]@users.noreply.github.com")) | length' 2>/dev/null || echo 1)"
          if [ -n "$number" ] && [ "$others" = "0" ]; then
            gh pr close "$number" --repo "$REPO" --delete-branch --comment "The site already matches Pulseboard main; this sync is no longer needed."
            echo "- ${REPO}: closed stale #${number}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Confine the diff to the synced files
        id: confine
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        run: |
          outside="$(git -C site status --porcelain --untracked-files=all | cut -c4- | grep -vxF -f allowed.txt || true)"
          if [ -n "$outside" ]; then echo "::error title=Unexpected change::The sync touched files outside its lock: $outside"; exit 1; fi
      - name: Open or update the pull request
        id: pr
        if: steps.sync.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
          SDK: ${{ steps.sync.outputs.sdk }}
          CHECK_OK: ${{ steps.sync.outputs.check_ok }}
        run: |
          source_sha="$(git -C pulseboard rev-parse --short HEAD)"
          base="$(gh repo view "$REPO" --json defaultBranchRef -q .defaultBranchRef.name)"
          cd site
          bot='41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git config user.email "$bot"
          # Push access starts here, after the site's code has run.
          gh auth setup-git
          # A person's commit on the sync branch (for example moving a pinned version) is never overwritten.
          if git fetch -q --depth=50 origin "$BRANCH" 2>/dev/null; then
            human="$(git log --format=%ae "origin/${base}..FETCH_HEAD" | grep -vxF "$bot" || true)"
            if [ -n "$human" ]; then
              echo "::warning title=Sync branch has human commits::${REPO} ${BRANCH} carries commits by a person; not replacing it. Merge or close that pull request first."
              echo "blocked=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          git switch -C "$BRANCH"
          git add -A
          git commit -q -m "Sync Pulseboard SDK ${SDK} from Pulseboard ${source_sha}"
          git push -q --force origin "$BRANCH"
          head="$(git rev-parse HEAD)"
          if [ "$CHECK_OK" = "true" ]; then
            title="Sync Pulseboard SDK ${SDK}"
            note="The site's own \`node observatory/check.mjs\` passes on this change. This pull request merges itself once every GitHub Actions run on it succeeds (Pulseboard HUMAN_TODO q-29)."
          else
            title="[needs a person] Sync Pulseboard SDK ${SDK}"
            note="**Not merged automatically:** the site's own \`node observatory/check.mjs\` fails on this change: $(cat ../check-detail.txt). Fix the site's policy on its default branch (for example a pinned SDK version in observatory/check.local.mjs); the next sync run then refreshes this pull request and merges it if everything passes."
          fi
          body="$(printf 'Generated by Pulseboard'"'"'s [Sync sites](https://github.com/%s/actions/runs/%s) workflow from Pulseboard `%s`. It rebuilds the SDK copies listed in `observatory.lock.json` and updates their hashes; nothing else changes.\n\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$source_sha" "$note")"
          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$number" ]; then
            gh pr create --repo "$REPO" --base "$base" --head "$BRANCH" --title "$title" --body "$body"
            number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          else
            gh pr edit "$number" --repo "$REPO" --title "$title" --body "$body"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "- ${REPO}: [#${number}](https://github.com/${REPO}/pull/${number}) ${title}" >> "$GITHUB_STEP_SUMMARY"
      - name: Merge when every check succeeds
        if: steps.sync.outputs.changed == 'true' && steps.sync.outputs.check_ok == 'true' && steps.pr.outputs.blocked != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          # Every pushed head ages at least three minutes before merge; it also lets the site's CI start.
          sleep 180
          runs="$(gh run list --repo "$REPO" --commit "$HEAD" --json databaseId -q '.[].databaseId')"
          for id in $runs; do
            gh run watch "$id" --repo "$REPO" --exit-status > /dev/null || { echo "::error title=Site CI failed::Run $id on ${REPO} failed; the pull request stays open."; exit 1; }
          done
          # Every check and status on the pull request, from Actions or elsewhere, must pass as well.
          if ! checks="$(gh pr checks "$NUMBER" --repo "$REPO" --watch --fail-fast 2>&1)"; then
            case "$checks" in
              *"no checks reported"*) echo "::notice title=No site CI::${REPO} reports no checks for this head; the site's own check passed in this job." ;;
              *) echo "::error title=Site checks failed::${checks}"; exit 1 ;;
            esac
          fi
          current="$(gh pr view "$NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)"
          if [ "$current" != "$HEAD" ]; then echo "::error title=Head moved::The pull request changed while waiting; not merging."; exit 1; fi
          gh pr merge "$NUMBER" --repo "$REPO" --merge --match-head-commit "$HEAD" --delete-branch
          echo "- ${REPO}: merged #${NUMBER}" >> "$GITHUB_STEP_SUMMARY"
