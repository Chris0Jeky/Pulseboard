name: Sync sites
# Keeps every site's installed Pulseboard SDK copy in step with main (owner decision 2026-09-27, HUMAN_TODO q-29).
# Two jobs per site, so the site's own code never runs where the token is, and nothing it produced is trusted there:
#   prepare - no secrets. Runs sync-hosts.mjs with the site's own observatory/check.mjs and uploads only a report,
#             of which publish reads two booleans: did the site check pass, and did a refreshed generated checker pass.
#   publish - holds SITES_TOKEN and runs no site code. Rebuilds every byte itself with sync-hosts.mjs --no-run on a
#             fresh clone (the site's lock is read as data; dot-folders and symlinked paths are refused), confines the
#             commit to those files, and opens or updates one pulseboard/sdk-sync pull request. A forged boolean can
#             at most auto-merge Pulseboard-generated files, and only if every check on the site still passes.
#             Otherwise the pull request stays open, titled [needs a person].
on:
  push:
    branches: [main]
    paths:
      - 'observatory/sdk/**'
      - 'observatory/src/projects.mjs'
      - 'observatory/src/alibi-releases.mjs'
      - 'observatory/src/release-label.mjs'
      - 'observatory/adapters/build-sdk.mjs'
      - 'observatory/adapters/build-embed.mjs'
      - 'observatory/adapters/check-installed.mjs'
      - 'observatory/adapters/sync-hosts.mjs'
      - '.github/workflows/sync-sites.yml'
  schedule:
    - cron: '41 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync-sites
  cancel-in-progress: false
env:
  BRANCH: pulseboard/sdk-sync
  BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { repo: Chris0Jeky/CV_and_Portfolio, name: cv }
          - { repo: Chris0Jeky/CommitAtlas, name: commitatlas }
          - { repo: Chris0Jeky/IdleHarbor, name: idleharbor }
          - { repo: Chris0Jeky/developer-lens, name: developer-lens }
          - { repo: Chris0Jeky/wealthlens-hq, name: wealthlens }
          - { repo: Chris0Jeky/MDviewer, name: mdviewer }
          - { repo: Chris0Jeky/Alibi, name: alibi }
    steps:
      - uses: actions/checkout@v6
        with:
          path: pulseboard
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ${{ matrix.repo }}
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Sync and run the site check (no secrets in this job)
        shell: bash
        run: |
          mkdir -p out
          node pulseboard/observatory/adapters/sync-hosts.mjs site > out/report.json
          echo "### ${{ matrix.repo }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"; cat out/report.json >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: sync-${{ matrix.name }}
          path: out
          retention-days: 3
  publish:
    needs: prepare
    # One site's failed prepare must not stop the others; its own publish then fails loudly on the missing report.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 2
      # Same list as the prepare job.
      matrix:
        include:
          - { repo: Chris0Jeky/CV_and_Portfolio, name: cv }
          - { repo: Chris0Jeky/CommitAtlas, name: commitatlas }
          - { repo: Chris0Jeky/IdleHarbor, name: idleharbor }
          - { repo: Chris0Jeky/developer-lens, name: developer-lens }
          - { repo: Chris0Jeky/wealthlens-hq, name: wealthlens }
          - { repo: Chris0Jeky/MDviewer, name: mdviewer }
          - { repo: Chris0Jeky/Alibi, name: alibi }
    env:
      REPO: ${{ matrix.repo }}
    steps:
      - name: Check the token
        id: token
        env:
          SITES_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          if [ -n "$SITES_TOKEN" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo '::notice title=Site sync skipped::Add the SITES_TOKEN repository secret to sync the sites (HUMAN_TODO q-29).'
          fi
      - uses: actions/download-artifact@v4
        if: steps.token.outputs.ready == 'true'
        with:
          name: sync-${{ matrix.name }}
          path: out
      - uses: actions/checkout@v6
        if: steps.token.outputs.ready == 'true'
        with:
          path: pulseboard
          persist-credentials: false
      - uses: actions/checkout@v6
        if: steps.token.outputs.ready == 'true'
        with:
          repository: ${{ matrix.repo }}
          path: site
          persist-credentials: false
      - uses: actions/setup-node@v6
        if: steps.token.outputs.ready == 'true'
        with:
          node-version: '22'
      - name: Rebuild from data only (no site code runs here)
        id: report
        if: steps.token.outputs.ready == 'true'
        shell: bash
        run: |
          # Only two booleans cross from the prepare job; anything else in its report is ignored.
          jq -e '(.hostCheck.ok | type) == "boolean" and (.checkerRefreshed | type) == "boolean"' out/report.json > /dev/null \
            || { echo "::error::The prepare report is malformed"; exit 1; }
          check_ok="$(jq -r '.hostCheck.ok' out/report.json)"
          jq -r 'if .hostCheck.ok then "" else (.hostCheck.detail // "" | tostring | .[0:300]) end' out/report.json > check-detail.txt
          flags=(--no-run)
          if [ "$(jq -r '.checkerRefreshed' out/report.json)" = "true" ]; then flags+=(--refresh-checker); fi
          node pulseboard/observatory/adapters/sync-hosts.mjs site "${flags[@]}" > own.json
          jq -e '.sdk | test("^[0-9]+\\.[0-9]+\\.[0-9]+$")' own.json > /dev/null || { echo "::error::Unexpected SDK version"; exit 1; }
          jq -r '.changed[]' own.json > changed.txt
          {
            echo "changed=$(jq -r '(.changed | length) > 0' own.json)"
            echo "sdk=$(jq -r '.sdk' own.json)"
            echo "check_ok=${check_ok}"
          } >> "$GITHUB_OUTPUT"
      - name: Look for a person's commits on the sync branch
        id: guard
        if: steps.token.outputs.ready == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          base="$(gh repo view "$REPO" --json defaultBranchRef -q .defaultBranchRef.name)"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # ls-remote tells "no such branch" (exit 2) apart from a network or auth failure (anything else).
          set +e; remote="$(git ls-remote --exit-code "https://github.com/${REPO}.git" "refs/heads/${BRANCH}")"; code=$?; set -e
          if [ "$code" = 2 ]; then echo "human=false" >> "$GITHUB_OUTPUT"; echo "lease=" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$code" != 0 ]; then echo "::error::Could not read ${REPO} ${BRANCH} (git exit ${code})."; exit 1; fi
          echo "lease=$(cut -f1 <<< "$remote")" >> "$GITHUB_OUTPUT"
          # The compare API lists every commit ahead of the base, however deep; authors and committers both count.
          emails="$(gh api "repos/${REPO}/compare/${base}...${BRANCH}" -q '.commits[] | .commit.author.email, .commit.committer.email')"
          if grep -vxF "$BOT_EMAIL" <<< "$emails" | grep -q .; then echo "human=true" >> "$GITHUB_OUTPUT"; else echo "human=false" >> "$GITHUB_OUTPUT"; fi
      - name: Close a sync pull request that is no longer needed
        if: steps.report.outputs.changed == 'false' && steps.guard.outputs.human == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
        run: |
          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -n "$number" ]; then
            gh pr close "$number" --repo "$REPO" --delete-branch --comment "The site already matches Pulseboard main; this sync is no longer needed."
            echo "- ${REPO}: closed stale #${number}" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Leave a person's work alone
        if: steps.report.outputs.changed == 'true' && steps.guard.outputs.human == 'true'
        run: echo "::warning title=Sync branch has a person's commits::${REPO} ${BRANCH} carries commits by a person; not replacing it. Merge or close that pull request, then the next run refreshes it."
      - name: Open or update the pull request
        id: pr
        if: steps.report.outputs.changed == 'true' && steps.guard.outputs.human == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
          SDK: ${{ steps.report.outputs.sdk }}
          CHECK_OK: ${{ steps.report.outputs.check_ok }}
          BASE: ${{ steps.guard.outputs.base }}
          LEASE: ${{ steps.guard.outputs.lease }}
        run: |
          cd site
          git config user.name 'github-actions[bot]'
          git config user.email "$BOT_EMAIL"
          git switch -C "$BRANCH"
          # The working tree holds only this job's own rebuild; stage exactly the files it reported.
          outside="$(git status --porcelain --untracked-files=all | cut -c4- | grep -vxF -f ../changed.txt || true)"
          if [ -n "$outside" ]; then echo "::error title=Unexpected change::Files changed outside the rebuild: ${outside}"; exit 1; fi
          git add -A
          git commit -q -m "Sync Pulseboard SDK ${SDK} from Pulseboard ${GITHUB_SHA:0:7}"
          outside="$(git diff --name-only HEAD~1 HEAD | grep -vxF -f ../changed.txt || true)"
          if [ -n "$outside" ]; then echo "::error title=Unexpected change::The commit touches files outside the sync: ${outside}"; exit 1; fi
          gh auth setup-git
          # The lease refuses the push if the branch moved since the guard looked (for example a person pushed).
          git push -q --force-with-lease="refs/heads/${BRANCH}:${LEASE}" origin "$BRANCH"
          head="$(git rev-parse HEAD)"
          if [ "$CHECK_OK" = "true" ]; then
            title="Sync Pulseboard SDK ${SDK}"
            note="The site's own \`node observatory/check.mjs\` passes on this change. This pull request merges itself once every check on it succeeds (Pulseboard HUMAN_TODO q-29)."
          else
            title="[needs a person] Sync Pulseboard SDK ${SDK}"
            note="**Not merged automatically:** the site's own \`node observatory/check.mjs\` fails on this change: $(cat ../check-detail.txt). Fix the site's policy on its default branch (for example a pinned SDK version in observatory/check.local.mjs); the next sync run then refreshes this pull request and merges it if everything passes."
          fi
          body="$(printf 'Generated by Pulseboard'"'"'s [Sync sites](https://github.com/%s/actions/runs/%s) workflow from Pulseboard `%s`. It rebuilds the SDK copies listed in `observatory.lock.json` and updates their hashes; nothing else changes.\n\n%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "${GITHUB_SHA:0:7}" "$note")"
          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          if [ -z "$number" ]; then
            gh pr create --repo "$REPO" --base "$BASE" --head "$BRANCH" --title "$title" --body "$body"
            number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number -q '.[0].number')"
          else
            gh pr edit "$number" --repo "$REPO" --title "$title" --body "$body"
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "- ${REPO}: [#${number}](https://github.com/${REPO}/pull/${number}) ${title}" >> "$GITHUB_STEP_SUMMARY"
      - name: Merge when every check succeeds
        if: steps.pr.outputs.number != '' && steps.report.outputs.check_ok == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.SITES_TOKEN }}
          NUMBER: ${{ steps.pr.outputs.number }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          # Every pushed head ages at least three minutes before merge; it also lets the site's CI start.
          sleep 180
          runs="$(gh run list --repo "$REPO" --commit "$HEAD" --json databaseId -q '.[].databaseId')"
          for id in $runs; do
            gh run watch "$id" --repo "$REPO" --exit-status > /dev/null || { echo "::error title=Site CI failed::Run $id on ${REPO} failed; the pull request stays open."; exit 1; }
          done
          # Every check and status on the pull request, from Actions or elsewhere, must pass as well.
          if ! checks="$(gh pr checks "$NUMBER" --repo "$REPO" --watch --fail-fast 2>&1)"; then
            case "$checks" in
              *"no checks reported"*) echo "::notice title=No site CI::${REPO} reports no checks for this head; the site's own check passed in the prepare job." ;;
              *) echo "::error title=Site checks failed::${checks}"; exit 1 ;;
            esac
          fi
          current="$(gh pr view "$NUMBER" --repo "$REPO" --json headRefOid -q .headRefOid)"
          if [ "$current" != "$HEAD" ]; then echo "::error title=Head moved::The pull request changed while waiting; not merging."; exit 1; fi
          gh pr merge "$NUMBER" --repo "$REPO" --merge --match-head-commit "$HEAD" --delete-branch
          echo "- ${REPO}: merged #${NUMBER}" >> "$GITHUB_STEP_SUMMARY"
