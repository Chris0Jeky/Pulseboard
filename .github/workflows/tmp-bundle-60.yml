name: Temporary bundle split proof

on:
  push:
    branches:
      - perf/frontend-bundle-60

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend/pulseboard-web
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/pulseboard-web/package-lock.json
      - run: npm ci
      - name: Run frontend tests
        run: npx vitest run --maxWorkers=2
      - name: Build production frontend
        run: npm run build
      - name: Enforce initial and per-chunk budgets
        run: npm run build:budget
      - name: Build production container
        run: docker build --tag pulseboard-frontend:bundle-ci .
      - name: Audit complete dependency graph
        run: npm audit --audit-level=low
      - name: Verify patch whitespace
        working-directory: .
        run: git diff --check origin/fix/frontend-audit-13...HEAD
