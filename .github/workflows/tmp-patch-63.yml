name: Temporary PR 63 operation validation

on:
  push:
    branches:
      - feat/alibi-journey-18

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies
        run: cd observatory && npm ci
      - name: Apply operation validation and verify
        run: python scripts/tmp_patch_63_bridge.py
