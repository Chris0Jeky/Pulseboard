name: Temporary run receipt proof

on:
  push:
    branches:
      - feat/run-receipts-23

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: observatory
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Run focused run receipt tests
        run: node --test tests/run-receipts.test.mjs
      - name: Run the complete Observatory suite
        run: npm test
      - name: Check new modules
        run: |
          node --check run-receipts/contracts.mjs
          node --check run-receipts/store.mjs
          node --check run-receipts/model.mjs
      - name: Check Worker packaging remains unchanged
        run: npx wrangler deploy --dry-run
      - name: Verify patch whitespace
        working-directory: .
        run: git diff --check origin/main...HEAD
